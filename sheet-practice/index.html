<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>Sheet Practice</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <canvas id="gl"></canvas>

  <header id="bar">
    <div class="group">
      <button id="btn-proc" title="Infinite generated practice material">🎲 Procedural</button>
      <label class="filebtn">📂 Open
        <input id="file" type="file" accept=".mid,.midi,.xml,.musicxml,.mxl" hidden>
      </label>
    </div>

    <div class="group">
      <button id="btn-play">▶ Play</button>
      <button id="btn-stop">⏹ Stop</button>
    </div>

    <div class="group">
      <button id="btn-audio">🔇 Audio</button>
      <button id="btn-midi">🎹 MIDI</button>
    </div>

    <div class="group">
      <label class="chk"><input type="checkbox" id="chk-practice"> Wait-for-key</label>
      <select id="sel-hand" title="Which hand must be played">
        <option value="both">Both hands</option>
        <option value="R">Right only</option>
        <option value="L">Left only</option>
      </select>
    </div>

    <div class="group sliders">
      <label>Tempo <span id="lbl-tempo">100%</span>
        <input id="rng-tempo" type="range" min="0.25" max="1.5" step="0.05" value="1"></label>
      <label>Window <span id="lbl-speed">6.0s</span>
        <input id="rng-speed" type="range" min="2" max="14" step="0.5" value="6"></label>
      <label>Vol
        <input id="rng-vol" type="range" min="-30" max="6" step="1" value="-6"></label>
      <label>Spelling
        <select id="sel-spell"><option value="sharp">♯</option><option value="flat">♭</option></select>
      </label>
    </div>
  </header>

  <aside id="panel">
    <h3>Parts</h3>
    <div id="parts"></div>
    <h3>Fingers</h3>
    <div id="legend"></div>
  </aside>

  <footer id="status">Loading…</footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
