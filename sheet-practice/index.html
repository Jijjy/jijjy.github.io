<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>Sheet Practice</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app.css">
</head>

<body>
  <canvas id="gl"></canvas>

  <header id="bar">
    <div class="group">
      <button id="btn-proc" title="Infinite generated practice material">🎲</button>
      <label class="filebtn">📂
        <input id="file" type="file" accept=".mid,.midi,.xml,.musicxml,.mxl" hidden>
      </label>
    </div>

    <div class="group">
      <button id="btn-play">▶</button>
      <button id="btn-stop">⏹</button>
    </div>

    <div class="group">
      <button id="btn-audio">🔇</button>
      <button id="btn-midi">🎹</button>
    </div>

    <button id="btn-collapse" class="bar-toggle" title="Show/hide controls" aria-label="Show or hide controls" aria-expanded="true">⚙</button>

    <div class="group collapsible">
      <label class="chk"><input type="checkbox" id="chk-practice"> Wait-for-key</label>
      <select id="sel-hand" title="Which hand must be played">
        <option value="both">Both hands</option>
        <option value="R">Right only</option>
        <option value="L">Left only</option>
      </select>
    </div>

    <div class="group sliders collapsible">
      <label><span class="lbl-row">Tempo <span id="lbl-tempo">82 BPM</span></span>
        <input id="rng-tempo" type="range" min="20" max="240" step="1" value="82"></label>
      <label><span class="lbl-row">Window <span id="lbl-speed">6.0s</span></span>
        <input id="rng-speed" type="range" min="2" max="14" step="0.5" value="6"></label>
      <label><span class="lbl-row">Vol <span id="lbl-vol">67%</span></span>
        <input id="rng-vol" type="range" min="-30" max="6" step="1" value="-6"></label>
      <label style="display:none">Spelling
        <select id="sel-spell">
          <option value="sharp">♯</option>
          <option value="flat">♭</option>
        </select>
      </label>
    </div>
  </header>

  <aside id="panel">
    <button id="panel-toggle" class="panel-toggle" aria-expanded="true">
      <span>Parts &amp; Fingers</span><span class="caret">▾</span>
    </button>
    <div id="panel-body">
      <h3>Parts</h3>
      <div id="parts"></div>
      <h3>Fingers</h3>
      <div id="legend"></div>
    </div>
  </aside>

  <footer id="status">Loading…</footer>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
