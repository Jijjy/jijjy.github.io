<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf6ec">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Games">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Jigsaw</title>
  <link rel="stylesheet" href="../games.css">
  <style>
    body { display: flex; flex-direction: column; overflow: hidden; height: 100vh; height: 100dvh; }

    /* No title: the three buttons share one line. */
    .topbar { flex-wrap: nowrap; gap: 8px; padding: 8px; }
    .topbar .btn { flex: 1 1 0; min-width: 0; max-width: 200px; padding: 0 8px; gap: 6px; white-space: nowrap; }
    .topbar .btn:first-child { margin-right: auto; }
    @media (max-width: 360px) { .topbar .btn { font-size: 0.9rem; padding: 0 4px; gap: 3px; } }

    #play {
      flex: 1;
      position: relative;
      min-height: 0;
      touch-action: none;
    }

    /* Where the picture goes. */
    #board {
      position: absolute;
      background: #fff;
      outline: 4px solid var(--border);
    }

    #guide {
      position: absolute;
      inset: 0;
      background-size: 100% 100%;
      opacity: 0.22;
      filter: grayscale(0.3);
    }

    .cell {
      position: absolute;
      border: 2px dashed rgba(0, 0, 0, 0.2);
    }

    .cell.hint { border: 6px solid var(--good); background: rgba(46, 125, 50, 0.15); z-index: 2; }

    /* Each loose piece waits in its own place, far enough from the others that pieces never touch.
       Waiting pieces can be smaller than the picture cells (--k); they grow to full size when moved. */
    .piece {
      position: absolute;
      cursor: grab;
      transform: scale(var(--k, 1));
      transition: left 0.25s, top 0.25s, transform 0.2s;
      z-index: 10;
      filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.35));
    }

    .piece.dragging {
      transition: transform 0.15s;
      transform: none;
      z-index: 100;
      filter: drop-shadow(0 12px 10px rgba(0, 0, 0, 0.4));
      cursor: grabbing;
    }

    .piece.selected {
      z-index: 20;
      filter: drop-shadow(0 0 4px #f57f17) drop-shadow(0 0 4px #f57f17) drop-shadow(0 0 3px #f57f17);
    }

    #winPic {
      display: block;
      width: min(320px, 70vw, 40vh);
      aspect-ratio: 1;
      margin: 0 auto 8px;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    .piece.placed {
      transform: none;
      filter: none;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <a class="btn" href="../">🏠 Home</a>
    <button class="btn" id="hint">💡 Hint</button>
    <button class="btn" id="next">🖼️ New</button>
  </div>

  <div id="play">
    <div id="board"><div id="guide"></div></div>
  </div>

  <div class="overlay" id="win">
    <div class="box">
      <canvas id="winPic"></canvas>
      <h2>Well done!</h2>
      <p>The picture is complete.</p>
      <div class="actions">
        <button class="btn primary" id="again">Next picture</button>
      </div>
    </div>
  </div>

  <script>
    // One big emoji on a soft background makes each picture.
    const PICTURES = [
      ['🐶', '#ffe0b2'], ['🐱', '#cfe8ff'], ['🌻', '#c8e6c9'], ['🍎', '#fff3c4'],
      ['🏠', '#d4ecff'], ['🦋', '#e4f5c8'], ['🐠', '#b3e5fc'], ['🚗', '#e3e3fa'],
      ['🐘', '#ffe4ec'], ['🦉', '#e6dcd6'], ['🍓', '#e3f4e4'], ['⛵', '#c5e3fb'],
    ];

    const N = 3;
    const TAB = 0.25;      // how far a tab sticks out, as part of the piece size
    const PAD = 0.28;      // room around each piece drawing for its tabs and outline
    const PITCH = 1.62;    // distance between waiting places, as piece sizes
    const $ = (id) => document.getElementById(id);
    const play = $('play'), board = $('board');

    let picIdx = Math.floor(Math.random() * PICTURES.length) - 1;
    let picture, pieces = [], selected = null, geo;

    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function drawPicture([emoji, color], size) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(size / 2, size / 2, size * 0.1, size / 2, size / 2, size * 0.75);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(1, color);
      g.fillStyle = grad;
      g.fillRect(0, 0, size, size);
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.font = `${size * 0.78}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      g.fillText(emoji, size / 2, size * 0.54);
      return c;
    }

    // Edge shapes. For the edge between two pieces, +1 means the first piece
    // (above, or to the left) has the tab and the second piece has the hole.
    function makeEdges() {
      const rnd = () => (Math.random() < 0.5 ? 1 : -1);
      const h = [...Array(N - 1)].map(() => [...Array(N)].map(rnd));  // below row r
      const v = [...Array(N)].map(() => [...Array(N - 1)].map(rnd));  // right of column c
      return (r, c) => ({
        top: r > 0 ? -h[r - 1][c] : 0,
        right: c < N - 1 ? v[r][c] : 0,
        bottom: r < N - 1 ? h[r][c] : 0,
        left: c > 0 ? -v[r][c - 1] : 0,
      });
    }

    // One side of a piece, from (x0, y0) to (x1, y1), going round the piece clockwise.
    // out: 1 = tab, -1 = hole, 0 = straight.
    function side(g, x0, y0, x1, y1, out) {
      if (!out) { g.lineTo(x1, y1); return; }
      const dx = x1 - x0, dy = y1 - y0;
      const nx = dy * out, ny = -dx * out;     // points out of the piece
      const P = (u, w) => [x0 + dx * u + nx * w, y0 + dy * u + ny * w];
      const curve = (a, b, c) => g.bezierCurveTo(...P(...a), ...P(...b), ...P(...c));
      g.lineTo(...P(0.36, 0));
      curve([0.41, 0], [0.43, 0.04], [0.40, 0.09]);
      curve([0.35, 0.17], [0.42, TAB], [0.5, TAB]);
      curve([0.58, TAB], [0.65, 0.17], [0.60, 0.09]);
      curve([0.57, 0.04], [0.59, 0], [0.64, 0]);
      g.lineTo(x1, y1);
    }

    function piecePath(g, s, e) {
      g.beginPath();
      g.moveTo(0, 0);
      side(g, 0, 0, s, 0, e.top);
      side(g, s, 0, s, s, e.right);
      side(g, s, s, 0, s, e.bottom);
      side(g, 0, s, 0, 0, e.left);
      g.closePath();
    }

    function drawPiece(pc) {
      const { s } = geo;
      const dpr = window.devicePixelRatio || 1;
      const full = s * (1 + 2 * PAD);
      const cv = pc.el;
      cv.width = cv.height = Math.round(full * dpr);
      cv.style.width = cv.style.height = full + 'px';
      const g = cv.getContext('2d');
      g.scale(dpr, dpr);
      g.translate(s * PAD, s * PAD);
      piecePath(g, s, pc.edges);
      g.save();
      g.clip();
      const r = Math.floor(pc.i / N), c = pc.i % N;
      g.drawImage(picture, -c * s, -r * s, s * N, s * N);
      g.restore();
      g.lineJoin = 'round';
      g.strokeStyle = 'rgba(0,0,0,0.35)';
      g.lineWidth = Math.max(1.5, s * 0.012);
      g.stroke();
    }

    function newPuzzle() {
      picIdx = (picIdx + 1) % PICTURES.length;
      picture = drawPicture(PICTURES[picIdx], 900);
      $('guide').style.backgroundImage = `url(${picture.toDataURL()})`;
      const edges = makeEdges();
      for (const p of pieces) p.el.remove();
      const slots = shuffle([...Array(N * N).keys()]);
      pieces = [...Array(N * N).keys()].map((i) => {
        const el = document.createElement('canvas');
        el.className = 'piece';
        const p = { i, slot: slots[i], placed: false, el, edges: edges(Math.floor(i / N), i % N) };
        el.addEventListener('pointerdown', (e) => pointerDown(e, p));
        play.appendChild(el);
        return p;
      });
      selected = null;
      $('win').classList.remove('show');
      layout();
    }

    // The picture and the waiting pieces: side by side when the screen is wide,
    // one above the other when it is tall. The picture gets as much room as it can,
    // while the waiting pieces stay at least MIN_K of their full size.
    const MIN_K = 0.55;

    // The best grid for the waiting pieces in a w x h area: [k, cols, rows].
    function trayFit(w, h, s) {
      let best = [0, N, N];
      for (let cols = 1; cols <= N * N; cols++) {
        const rows = Math.ceil(N * N / cols);
        const k = Math.min(1, w / (cols * PITCH * s), h / (rows * PITCH * s));
        if (k > best[0]) best = [k, cols, rows];
      }
      return best;
    }

    function layout() {
      const W = play.clientWidth, H = play.clientHeight, pad = 8, gap = 12;
      const wide = W > H;
      let s = Math.min(W - pad * 2, H - pad * 2) / N, fit = [MIN_K, N, N];
      for (; s > 8; s *= 0.98) {
        const tw = wide ? W - pad * 2 - N * s - gap : W - pad * 2;
        const th = wide ? H - pad * 2 : H - pad * 2 - N * s - gap;
        if (tw <= 0 || th <= 0) continue;
        fit = trayFit(tw, th, s);
        if (fit[0] >= MIN_K) break;
      }
      const [k, cols, rows] = fit;
      const P = PITCH * k * s;   // distance between waiting places
      let bx, by, tx, ty;
      if (wide) {
        bx = (W - (N * s + gap + cols * P)) / 2; by = (H - N * s) / 2;
        tx = bx + N * s + gap; ty = (H - rows * P) / 2;
      } else {
        bx = (W - N * s) / 2; by = (H - (N * s + gap + rows * P)) / 2;
        tx = (W - cols * P) / 2; ty = by + N * s + gap;
      }
      geo = { s, bx, by, tx, ty, P, cols };
      play.style.setProperty('--k', k);

      board.style.left = bx + 'px';
      board.style.top = by + 'px';
      board.style.width = board.style.height = N * s + 'px';

      for (const el of board.querySelectorAll('.cell')) el.remove();
      for (let k = 0; k < N * N; k++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.style.left = (k % N) * s + 'px';
        cell.style.top = Math.floor(k / N) * s + 'px';
        cell.style.width = cell.style.height = s + 'px';
        cell.dataset.k = k;
        cell.addEventListener('click', () => tapCell(k, cell));
        board.appendChild(cell);
      }
      for (const pc of pieces) { drawPiece(pc); place(pc); }
    }

    // Where the square part of a piece sits: its cell in the picture, or its waiting place.
    function home(pc) {
      const { s, bx, by, tx, ty } = geo;
      if (pc.placed) return [bx + (pc.i % N) * s, by + Math.floor(pc.i / N) * s];
      const { P, cols } = geo;
      return [tx + (pc.slot % cols + 0.5) * P - s / 2, ty + (Math.floor(pc.slot / cols) + 0.5) * P - s / 2];
    }

    function place(pc) {
      const [x, y] = home(pc);
      pc.el.style.left = x - geo.s * PAD + 'px';
      pc.el.style.top = y - geo.s * PAD + 'px';
      pc.el.classList.toggle('placed', pc.placed);
    }

    function setPlaced(pc) {
      pc.placed = true;
      pc.el.classList.remove('selected');
      if (selected === pc) selected = null;
      place(pc);
      clearHint();
      if (pieces.every((q) => q.placed)) setTimeout(showWin, 600);
    }

    // The complete picture, with the piece lines faintly on it.
    function showWin() {
      const size = picture.width, s = size / N;
      const lines = document.createElement('canvas');
      lines.width = lines.height = size;
      const lg = lines.getContext('2d');
      lg.lineJoin = 'round';
      lg.lineWidth = size * 0.004;
      for (const pc of pieces) {
        lg.save();
        lg.translate((pc.i % N) * s, Math.floor(pc.i / N) * s);
        piecePath(lg, s, pc.edges);
        lg.stroke();
        lg.restore();
      }
      const cv = $('winPic');
      cv.width = cv.height = size;
      const g = cv.getContext('2d');
      g.drawImage(picture, 0, 0);
      g.globalAlpha = 0.2;
      g.drawImage(lines, 0, 0);
      $('win').classList.add('show');
    }

    function select(pc) {
      if (selected) selected.el.classList.remove('selected');
      selected = selected === pc ? null : pc;
      if (selected) selected.el.classList.add('selected');
    }

    function tapCell(k, cell) {
      if (!selected) return;
      if (selected.i === k) setPlaced(selected);
      else {
        cell.classList.remove('shake');
        void cell.offsetWidth;
        cell.classList.add('shake');
      }
    }

    // ---------- dragging ----------
    let drag = null;

    function pointerDown(e, pc) {
      if (pc.placed || drag || !e.isPrimary) return;
      e.preventDefault();
      pc.el.setPointerCapture(e.pointerId);
      drag = {
        pc, x0: e.clientX, y0: e.clientY, moving: false,
        left: parseFloat(pc.el.style.left), top: parseFloat(pc.el.style.top),
      };
    }

    play.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
      if (!drag.moving) {
        if (Math.hypot(dx, dy) < 12) return;
        drag.moving = true;
        drag.pc.el.classList.add('dragging');
      }
      drag.pc.el.style.left = drag.left + dx + 'px';
      drag.pc.el.style.top = drag.top + dy + 'px';
    });

    play.addEventListener('pointerup', () => {
      const d = drag;
      drag = null;
      if (!d) return;
      const pc = d.pc;
      if (!d.moving) { select(pc); return; }
      pc.el.classList.remove('dragging');
      // Accept the piece when its middle is near enough to its own place.
      const { s, bx, by } = geo;
      const cx = parseFloat(pc.el.style.left) + s * (PAD + 0.5);
      const cy = parseFloat(pc.el.style.top) + s * (PAD + 0.5);
      const hx = bx + (pc.i % N) * s + s / 2, hy = by + Math.floor(pc.i / N) * s + s / 2;
      if (Math.abs(cx - hx) < s * 0.6 && Math.abs(cy - hy) < s * 0.6) setPlaced(pc);
      else place(pc);   // goes back to its waiting place
    });

    play.addEventListener('pointercancel', () => {
      if (!drag) return;
      drag.pc.el.classList.remove('dragging');
      place(drag.pc);
      drag = null;
    });

    let hintTimer = 0;
    function hint() {
      clearHint();
      const pc = selected || pieces.find((q) => !q.placed);
      if (!pc) return;
      if (!selected) select(pc);
      board.querySelector(`.cell[data-k="${pc.i}"]`).classList.add('hint');
      hintTimer = setTimeout(clearHint, 3000);
    }

    function clearHint() {
      clearTimeout(hintTimer);
      for (const el of board.querySelectorAll('.hint')) el.classList.remove('hint');
    }

    $('hint').addEventListener('click', hint);
    $('next').addEventListener('click', newPuzzle);
    $('again').addEventListener('click', newPuzzle);
    window.addEventListener('resize', layout);

    newPuzzle();
  </script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => { });
  </script>
</body>

</html>
