<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf6ec">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Games">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Games</title>
  <link rel="stylesheet" href="games.css">
  <style>
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 8px 16px 40px;
    }

    header {
      text-align: center;
      padding: 28px 16px 12px;
    }

    header h1 { font-size: 2.4rem; margin: 0; }
    header p { font-size: 1.3rem; color: var(--muted); margin: 8px 0 0; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-top: 24px;
    }

    .game {
      display: flex;
      align-items: center;
      gap: 24px;
      min-height: 170px;
      padding: 24px 28px;
      background: var(--card);
      border: 3px solid var(--border);
      border-radius: var(--radius);
      color: var(--fg);
      text-decoration: none;
      box-shadow: 0 4px 0 var(--border);
    }

    .game:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--border);
      background: var(--accent-soft);
    }

    .game:focus-visible { outline: 4px solid #f9a825; outline-offset: 3px; }

    .game .icon {
      font-size: 4.2rem;
      line-height: 1;
      flex: 0 0 auto;
      width: 1.3em;
      text-align: center;
    }

    .game .name { font-size: 1.6rem; font-weight: 800; }
    .game .about { font-size: 1.1rem; color: var(--muted); margin-top: 6px; }
  </style>
</head>

<body>
  <header>
    <h1>Games</h1>
    <p>Tap a game to play</p>
  </header>

  <main>
    <nav class="grid">
      <a class="game" href="mahjong/">
        <span class="icon" aria-hidden="true">🀄</span>
        <span>
          <div class="name">Mahjong</div>
          <div class="about">Find matching pictures</div>
        </span>
      </a>

      <a class="game" href="solitaire/">
        <span class="icon" aria-hidden="true">🃏</span>
        <span>
          <div class="name">Solitaire</div>
          <div class="about">The classic card game</div>
        </span>
      </a>

      <a class="game" href="jigsaw/">
        <span class="icon" aria-hidden="true">🧩</span>
        <span>
          <div class="name">Jigsaw</div>
          <div class="about">Put the picture together</div>
        </span>
      </a>

      <a class="game" href="words/#pictures">
        <span class="icon" aria-hidden="true">🍎</span>
        <span>
          <div class="name">Picture Words</div>
          <div class="about">Name the picture</div>
        </span>
      </a>

      <a class="game" href="words/#sayings">
        <span class="icon" aria-hidden="true">💬</span>
        <span>
          <div class="name">Finish the Saying</div>
          <div class="about">Old sayings and songs</div>
        </span>
      </a>

      <a class="game" href="words/#opposites">
        <span class="icon" aria-hidden="true">☀️</span>
        <span>
          <div class="name">Opposites</div>
          <div class="about">Hot and cold, up and down</div>
        </span>
      </a>
    </nav>
  </main>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => { });
  </script>
</body>

</html>
